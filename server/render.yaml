services:
  - type: web
    name: mfa-api
    runtime: node
    plan: free
    region: frankfurt
    # --include=dev forces devDeps install even with NODE_ENV=production
    # (tsc, tsc-alias, @types, prisma CLI all live in devDependencies).
    buildCommand: npm ci --include=dev && npx prisma generate && npm run build
    startCommand: node -r tsconfig-paths/register ./dist/server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PROJECT_NAME
        value: My Funded Academy
      - key: PORT
        value: 5000
      # All other secrets are set via the Render dashboard, not committed:
      # DATABASE_URL, JWT_*, ADMIN_*, RESEND_*, STRIPE_*, VDOCIPHER_*, S3_*, etc.
